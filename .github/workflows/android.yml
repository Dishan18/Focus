name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: ./gradlew assembleDebug --no-configuration-cache

      # Tag builds are signed with the release key stored in repo secrets:
      # KEYSTORE_BASE64 (base64 of release.jks) and KEYSTORE_PASSWORD.
      - name: Restore signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Add KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf "storeFile=release.jks\nstorePassword=%s\nkeyAlias=regain\nkeyPassword=%s\n" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BUDDY_PHONE: ${{ secrets.BUDDY_PHONE }}
        run: |
          ./gradlew assembleRelease --no-configuration-cache
          cp app/build/outputs/apk/release/app-release.apk "Focus-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Focus-*.apk
          generate_release_notes: true
